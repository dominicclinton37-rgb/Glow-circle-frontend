<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no, address=no, email=no, date=no" />
    <script>
      function showCrash(text) {
        var el = document.getElementById("crash-report") || document.createElement("div");
        el.id = "crash-report";
        el.style = "position:fixed;inset:0;background:#fff;color:#900;padding:20px;font-family:monospace;font-size:13px;z-index:99999;overflow:auto;white-space:pre-wrap;";
        el.textContent = text;
        document.body.appendChild(el);
      }
      window.addEventListener("error", function (e) {
        var msg = e.error ? (e.error.name + ": " + e.error.message + "\n\n" + (e.error.stack || "")) : e.message;
        showCrash("App crashed:\n\n" + msg);
      });
      window.addEventListener("unhandledrejection", function (e) {
        var r = e.reason;
        var msg = r && r.message ? (r.name + ": " + r.message + "\n\n" + (r.stack || "")) : String(r);
        showCrash("Unhandled promise rejection:\n\n" + msg);
      });
    </script>
    <title>Glow Circle — Beauty Services Marketplace</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
